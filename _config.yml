kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footer: true
  toc_top: true
  toc_types: ["h1", "h2", "h3", "h4", "h5", "h6"]
  smart_quotes: true
  disable_rules: ["weekday"]
  syntax_highlighter: rouge
  syntax_highlight_theme: "default"
  document_baseurl: ""
  code_block_captions: true
  embeds: true
  footer: true
  toc_difficult_blocks: "mathjax"
  sequence_converter: [
    { pattern: "$1 $2", replacement: "<ol>\\2</ol>" },
    { pattern: "$1 $2", replacement: "<ul>\\2</ul>" },
    { pattern: "$1 $2 $3", replacement: "<dl>\\2</dl>" },
    { pattern: "$1 $2 $3", replacement: "<dt>\\2</dt>" },
    { pattern: "$1 $2 $3", replacement: "<dd>\\2</dd>" }
  ]